<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="640" height="360" rx="16" fill="#0e0f13"/>

  <!-- collapsed pill -->
  <g transform="translate(28,150)">
    <rect width="240" height="46" rx="23" fill="#20232b" stroke="#2c2f38"/>
    <circle cx="24" cy="23" r="5" fill="#22c55e"/>
    <text x="44" y="30" font-size="20">🇵🇹</text>
    <text x="74" y="29" fill="#f3f4f6" font-size="15" font-weight="600">19%</text>
    <text x="112" y="29" fill="#22c55e" font-size="15" font-weight="700">+72.7%</text>
    <line x1="176" y1="12" x2="176" y2="34" stroke="#2c2f38"/>
    <text x="186" y="29" fill="#22c55e" font-size="15" font-weight="700">+$9.60</text>
  </g>
  <text x="28" y="228" fill="#6b7280" font-size="12">collapsed pill</text>

  <!-- expanded panel -->
  <g transform="translate(330,40)">
    <rect width="282" height="280" rx="18" fill="#181a20" stroke="#2c2f38"/>
    <text x="18" y="34" fill="#f3f4f6" font-size="14" font-weight="700">Your live bets</text>
    <rect x="132" y="20" width="52" height="18" rx="9" fill="#12321f"/>
    <text x="142" y="33" fill="#22c55e" font-size="10" font-weight="700">● LIVE</text>
    <text x="250" y="33" fill="#cbd5e1" font-size="13">✕</text>

    <!-- card -->
    <g transform="translate(16,52)">
      <rect width="250" height="150" rx="14" fill="#1e2129" stroke="#2c2f38"/>
      <text x="14" y="30" font-size="22">🇵🇹</text>
      <text x="46" y="26" fill="#e5e7eb" font-size="13" font-weight="600">Portugal vs Spain</text>
      <text x="46" y="42" fill="#9ca3af" font-size="11">Euro 2028</text>
      <text x="14" y="82" fill="#f9fafb" font-size="24" font-weight="800">19%</text>
      <text x="14" y="98" fill="#9ca3af" font-size="11">odds</text>
      <text x="236" y="80" fill="#22c55e" font-size="16" font-weight="800" text-anchor="end">+$9.60</text>
      <text x="236" y="96" fill="#9ca3af" font-size="11" text-anchor="end">+72.7% · in @ 11%</text>
      <rect x="14" y="112" width="112" height="30" rx="9" fill="#16a34a"/>
      <text x="70" y="132" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Buy</text>
      <rect x="134" y="112" width="102" height="30" rx="9" fill="#3a1f22" stroke="#5c2b30"/>
      <text x="185" y="132" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">Sell</text>
    </g>

    <!-- dots -->
    <g transform="translate(105,222)">
      <rect x="0" y="0" width="18" height="6" rx="3" fill="#22c55e"/>
      <circle cx="30" cy="3" r="3" fill="#3a3f4a"/>
      <circle cx="44" cy="3" r="3" fill="#3a3f4a"/>
    </g>
    <text x="141" y="252" fill="#6b7280" font-size="10" text-anchor="middle">Swipe for more · odds from Polymarket</text>
  </g>
  <text x="330" y="338" fill="#6b7280" font-size="12">tap → swipeable deck (3 / page)</text>
</svg>
